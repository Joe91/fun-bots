name: Nav checks

on:
  push:
    paths:
      - 'mapfiles/**'
      - 'navzones/**'
      - 'tools/debug-server/**.py'
      - 'tools/debug-server/**.json'
      - '.github/workflows/nav-checks.yml'
  pull_request:
    paths:
      - 'mapfiles/**'
      - 'navzones/**'
      - 'tools/debug-server/**.py'
      - 'tools/debug-server/**.json'
      - '.github/workflows/nav-checks.yml'

jobs:
  nav:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/debug-server
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests of the debug-server
        run: python -m unittest discover -s tests
      - name: Route lint (mesh + paths of all levels)
        run: python -m funbots_debug.census lint
